## 目录结构

```
prompts/
├── 提取/
│   ├── 1_新案材料提取_D1-D5.md      # ⭐ 核心：从材料提取5维度
│   ├── 2_跨案归纳_Artifact汇聚.md    # 从同类artifact归纳通用结构
│   └── 3_质量检查_提取物审核.md     # 提取物质量审核标准
│
├── 匹配/
│   └── 4_新案匹配_相似案源检索.md   # 新案匹配相似案件
│
└── 生成/
    ├── 5_答辩状生成.md              # 答辩状生成
    ├── 6_质证意见生成.md            # 质证意见生成
    ├── 7_当庭陈述生成.md            # 当庭陈述生成
    └── 8_证据目录生成.md            # 证据目录生成
```

