## 快速使用指南

### 流程A：提取新案材料 → 入库

```
1. 准备材料：原告起诉状 + 证据材料 + 答辩材料（如有）
2. 复制 prompts/提取/1_新案材料提取_D1-D5.md 全部内容
3. 在 AI 对话中粘贴，并补充【案件材料】部分
4. AI 输出 5 维度提取结果
5. 复制 prompts/提取/3_质量检查_提取物审核.md
6. 对提取结果进行质量审核
7. 审核通过后入库
```

### 流程B：新案分析 → 文书输出

```
1. 输入新案基本信息（案号/原告/被告/案由/场景）
2. 复制 prompts/匹配/4_新案匹配_相似案源检索.md
3. 在 AI 对话中粘贴，AI 匹配相似案件
4. 选择参考案件，AI 列出相关 artifact
5. 根据文书类型，选择对应生成提示词：
   - 答辩状 → prompts/生成/5_答辩状生成.md
   - 质证意见 → prompts/生成/6_质证意见生成.md
   - 当庭陈述 → prompts/生成/7_当庭陈述生成.md
   - 证据目录 → prompts/生成/8_证据目录生成.md
6. AI 生成文书内容
7. 导出为 MD 或 DOCX
```

---

## 提示词命名规范

- 文件名格式：`{序号}_{提示词名称}_{用途}.md`
- 序号：工作流中的顺序（1-8）
- 编码：UTF-8，无 BOM
- 修改记录：仅在文件头部 VERSION 部分更新

---

## 质量要求

1. **不可直接输出文书**：提示词设计为"提取+参考"模式，AI 不得直接生成完整文书
2. **保留引用来源**：所有引用必须标注来自哪个 artifact
3. **强制事实区分**：区分"已证事实"和"推论事实"
4. **逻辑自洽**：前后论证不得矛盾
