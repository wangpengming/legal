name: court-doc-generator
version: 1.2.0
status: active
description: 出庭手续文档生成器（7份材料 + 多代理人材料动态绑定 + PDF合并预览 + 拍照扫描功能规划中）
entry: app.py
port:
  app: 18501          # Streamlit 主端口（避开默认 8501）
  fallback: 19000     # 默认端口被占用时备选
deps: [] # 直接依赖的其他模块（当前无）
created: 2026-08-17
tech_stack:
  - Python 3.12
  - Streamlit
  - SQLite
  - python-docx
  - pypdf
  - PyMuPDF
features:
  - Word模板填充（中文全角【】占位符）
  - DOCX转PDF
  - PDF合并
  - 浏览器内PDF预览（PDF.js base64方案）
  - ZIP打包
  - 多代理人材料动态绑定（v1.2.0）：06/07 PDF 跟随 agent + 04 授权委托书被授权人姓名/身份证号动态填充
  - 拍照扫描功能（规划中，待澄清需求）
readme: docs/README.md
