name: court-doc-generator
version: 1.1.4
status: active
description: 出庭手续文档生成器（7份材料一键生成 + PDF合并预览 + 拍照扫描功能规划中）
entry: app.py
deps: [] # 直接依赖的其他模块（当前无）
created: 2026-08-17
tech_stack:
  - Python 3.12
  - Streamlit
  - SQLite
  - python-docx
  - pypdf
  - PyMuPDF
features:
  - Word模板填充（中文全角【】占位符）
