name: thunderbox-console
version: 0.0.1
status: planning
description: 雷盒控制台（Thunderbox Console）— Thunderbox PaaS 部署平台的 MCP 可视化管理系统（应用全生命周期/数据库工作台/日志/域名探测，纯页面操作零命令行）
entry: none
deps: []
  # 依赖 Thunderbox MCP 端点（https://api-box.tbox.ktvsky.com/mcp，Bearer Token 走 .env）
  # 不直接 import 其他模块代码（AGENTS.md §10.4.3）
created: 2026-08-24
integrated: 2026-08-24
port:
  backend: 8002     # FastAPI（REST 网关，封装 MCP 13 工具）
  frontend: 18503   # React/Vite dev server（正式版后端托管 build 产物）
tech_stack:
  - backend: FastAPI + httpx（MCP streamable HTTP 客户端封装，token 仅后端持有）
  - frontend: React 18 + Vite + TypeScript（复用 litigation-system / court-doc-generator 前端栈）
  - 存储: SQLite（审计日志 + 部署状态本地缓存，可选）
  - 深色科技风设计系统（Vercel/Railway 系，与 portal 商务浅色差异化）
features:
  - 总览 Dashboard（应用统计/状态分布/最近部署活动/平台资源）
  - 应用列表（卡片/表格双视图、搜索筛选、状态徽章、一键部署入口）
  - 创建应用四步向导（来源 Git/Docker → 构建配置 → 环境变量/数据库/卷 → 域名权限确认）
  - 应用详情（状态机：building/deploying/running/failed、部署历史时间线、回滚、启停、取消构建）
  - 配置中心（环境变量增量管理、访问模式 public/internal/restricted + 白名单、协管员、ref、卷）
  - 数据库工作台（表列表/schema 查看/SQL 执行器 ro-rw 切换/版本化迁移管理）
  - 日志控制台（构建日志/运行日志，终端风格，自动滚动）
  - 域名与资源探测（thunderbox_check 可视化）
  - 审计日志（写操作全记录，风险操作二次确认）
readme: README.md
spec: docs/SPEC.md