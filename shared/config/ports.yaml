# =============================================
# 模块端口注册表 / Module Port Registry
# =============================================
# 原则（详见 AGENTS.md §10.4.2）：
#   1. 每个模块端口必须在此登记，避免冲突
#   2. module.yaml 强制声明 port 字段，与本表一致
#   3. 启动前 start.py 必须检测端口占用
#   4. 端口冲突时，先查本表定位占用方，再调整
# =============================================

# 端口分配规则速查
# | 类型              | 推荐段          | 说明                         |
# |-------------------|-----------------|------------------------------|
# | Streamlit         | 18500-18599     | 避开 8501 默认端口            |
# | FastAPI           | 8000-8099       | 8000 为首选                   |
# | 前端（Vite/Nginx）| 5173 / 8080     | 5173=Vite dev；8080=生产      |
# | 数据库容器        | 5432 / 8090+    | PostgreSQL/NocoDB/Paperless |
# | OCR/文件转换      | 8092-8099       | Gotenberg/Tika              |

allocations:
  # court-doc-generator 全栈重构（v2.0.0 React + FastAPI）
  court-doc-generator:
    backend: 8001       # FastAPI Python 后端
    frontend: 18502    # React/Vite 前端（Vite dev server）

  # FastAPI + 前端 模块
  litigation-system:
    api: 8000           # FastAPI 后端
    web: 8080           # 前端 Nginx 容器对外端口
    fallback_api: 18000 # 后端端口被占用时备选

  # Streamlit 单进程模块（v3.4.1：无 Docker Compose 依赖，历史 NocoDB/Paperless 端口已废弃移除）
  case-intelligence:
    ui: 18503               # Streamlit Web UI（对外唯一端口，含上传/提取/生成全链路）
  
  # 雷盒控制台（Thunderbox MCP 可视化管理系统）
  thunderbox-console:
    backend: 18504     # FastAPI 网关（MCP 13 工具 → REST）
    frontend: 18506    # 单文件 HTML SPA（18503 已归 case-intelligence UI，避免冲突）

# 端口冲突解决策略
conflict_resolution:
  - "固定端口，不换端口"
  - "端口被占用 → 强制终止占用进程（kill_port_owner）→ 重新绑定"
  - "清理失败 → 报错退出，提示手动 python3 bin/stop.py"
